<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Card B3 · pain beat 3 — no safe way to say hi</title>
<link rel="stylesheet" href="cards.css">
<style>
.dark{background:radial-gradient(900px 520px at 50% -8%,rgba(232,163,92,.30),transparent 65%),radial-gradient(1100px 700px at 50% 120%,rgba(41,76,62,.55),transparent 60%),linear-gradient(#17191d,#1b2420 70%,#182d26)}
.dark .frame{border-color:#0f1a16}.dark .frame::after{border-color:rgba(244,242,232,.16)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45));pointer-events:none;z-index:40}
.eyebrow{color:rgba(244,242,232,.55)}
.eyebrow.tl{position:absolute;left:78px;top:70px;opacity:0;animation:fade .6s .2s forwards}
.eyebrow.tr{position:absolute;right:78px;top:70px;opacity:0;animation:fade .6s .3s forwards}
.floor{background:linear-gradient(#3a2a20,#2a1f18);height:140px;opacity:.9}
.floor::before{background:linear-gradient(#52382a,#3a2a20)}
.crowd img{position:absolute;bottom:58px;height:430px;width:auto;filter:grayscale(.85) brightness(.55) contrast(.9);opacity:0;animation:crowdin .9s forwards,bob 3s ease-in-out infinite}
@keyframes crowdin{from{opacity:0;transform:translateY(60px)}to{opacity:.8;transform:none}}
.me{position:absolute;bottom:58px;left:196px;height:470px;width:auto;z-index:20;opacity:0;animation:mein .8s .5s cubic-bezier(.2,.9,.25,1) forwards,bob 2.6s 1.3s ease-in-out infinite;filter:drop-shadow(0 18px 18px rgba(0,0,0,.55))}
@keyframes mein{from{opacity:0;transform:translateX(-200px)}to{opacity:1;transform:none}}
.bubble{position:absolute;left:372px;top:480px;width:230px;height:150px;background:var(--paper2);border-radius:28px;display:grid;place-items:center;z-index:25;opacity:0;animation:bub .6s 1.5s cubic-bezier(.2,.9,.25,1.3) forwards;box-shadow:0 18px 26px rgba(0,0,0,.45)}
.bubble::after{content:"";position:absolute;left:22px;bottom:-26px;border:18px solid transparent;border-top-color:var(--paper2);border-bottom:0;border-left-width:6px;border-right-width:30px}
.bubble b{font:900 80px/1 Arial,sans-serif;letter-spacing:.1em;color:var(--green);animation:dots 1.2s 2.1s steps(1) infinite}
@keyframes bub{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes dots{0%{opacity:1}50%{opacity:.35}}
.q{position:absolute;left:480px;top:424px;font:900 74px/1 Arial,sans-serif;color:var(--accent);z-index:26;opacity:0;animation:fade .4s 2.0s forwards,wob 1.2s 2.0s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.pane{position:absolute;left:660px;top:470px;width:150px;bottom:40px;background:linear-gradient(90deg,rgba(244,242,232,.05),rgba(244,242,232,.14),rgba(244,242,232,.05));backdrop-filter:blur(7px);border-left:2px solid rgba(244,242,232,.28);border-right:2px solid rgba(244,242,232,.28);z-index:22;opacity:0;animation:fade .6s 1.1s forwards}
.line{position:absolute;left:0;right:0;text-align:center;color:var(--cream);font-weight:600;letter-spacing:.05em;opacity:0;z-index:35;text-shadow:0 6px 36px rgba(0,0,0,.7)}
.l1{top:150px;font-size:84px;animation:rise .7s 1.6s cubic-bezier(.2,.9,.25,1) forwards}
.l2{top:268px;font-size:100px;animation:rise .7s 2.5s cubic-bezier(.2,.9,.25,1) forwards}
.l2 .hl{color:var(--accent)}.l2 .hl::before{height:.09em;bottom:-.02em;transform:scaleX(0);animation:sweep .5s 3.3s cubic-bezier(.3,.7,.2,1) forwards}
.note{position:absolute;right:78px;bottom:58px;font-family:var(--mono);font-size:15px;letter-spacing:.14em;color:rgba(244,242,232,.45);z-index:45;opacity:0;animation:fade .6s .6s forwards}
</style></head>
<body>
<div class="card dark grain">
  <div class="eyebrow tl">STRANGERS / 同场的人</div>
  <div class="eyebrow tr">NO SAFE WAY IN</div>
  <div class="floor"></div>
  <div class="crowd" id="crowd"></div>
  <img class="me" src="assets/avatar-echo-front.svg">
  <div class="bubble"><b>…</b></div><div class="q">?</div>
  <div class="pane"></div>
  <div class="line l1">想认识同场的人，</div>
  <div class="line l2">却没有一个<span class="hl">安全的开口</span>。</div>
  <div class="note">示例角色为虚构</div>
  <div class="vignette"></div><div class="frame"></div>
</div>
<script>
const look=['static-front','break-quarter','loop-quarter','fuzz-quarter','phones-front','pulse-quarter','cap-quarter'];
const root=document.getElementById('crowd');
const xs=[880,1000,1120,1240,1360,1480,1600,1720,940,1300];
xs.forEach((x,i)=>{const im=document.createElement('img');im.src=`assets/avatar-${look[i%look.length]}.svg`;im.style.left=x+'px';im.style.height=(330+((i*37)%60))+'px';im.style.bottom=(40+(i%3)*14)+'px';im.style.animationDelay=`${(0.3+i*0.1).toFixed(2)}s, ${(1+i*0.17).toFixed(2)}s`;im.style.zIndex=String(10+i%3);root.appendChild(im);});
</script>
</body></html>
