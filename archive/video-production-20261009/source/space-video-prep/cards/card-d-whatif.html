<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Card D · what if — the lock opens (by consent)</title>
<link rel="stylesheet" href="cards.css">
<style>
.dark{background:radial-gradient(900px 520px at 50% -8%,rgba(232,163,92,.34),transparent 65%),radial-gradient(1100px 700px at 50% 120%,rgba(41,76,62,.55),transparent 60%),linear-gradient(#17191d,#1b2420 70%,#182d26)}
.dark .frame{border-color:#0f1a16}.dark .frame::after{border-color:rgba(244,242,232,.16)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45));pointer-events:none;z-index:40}
.eyebrow{color:rgba(244,242,232,.55)}
.eyebrow.tl{position:absolute;left:78px;top:70px;opacity:0;animation:fade .6s .2s forwards}
.eyebrow.tr{position:absolute;right:78px;top:70px;opacity:0;animation:fade .6s .3s forwards}
.pola{position:absolute;width:560px;background:var(--paper2);padding:24px 24px 82px;box-shadow:0 40px 60px rgba(0,0,0,.55);top:160px}
.pola .ph{width:100%;aspect-ratio:3/2;background-size:cover;background-position:center;position:relative;overflow:hidden}
.pola .cap{position:absolute;left:28px;right:28px;bottom:22px;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:18px;letter-spacing:.14em;color:#4b5148}
.pola .cap b{font-family:var(--sans);font-size:28px;letter-spacing:.04em;color:var(--ink);font-weight:600}
.tape{position:absolute;top:-22px;left:50%;width:140px;height:42px;margin-left:-70px;background:rgba(219,232,115,.8);box-shadow:0 2px 3px rgba(0,0,0,.18)}
.pola.l{left:300px;rotate:-5deg;animation:lin 1s .1s cubic-bezier(.2,.9,.25,1) both,slideTogetherL 1.2s 2.4s cubic-bezier(.5,0,.2,1) forwards}
.pola.l .ph{background-image:url(assets/stage-scene.webp)}
.pola.r{right:300px;rotate:4deg;animation:rin 1s .1s cubic-bezier(.2,.9,.25,1) both,slideTogetherR 1.2s 2.4s cubic-bezier(.5,0,.2,1) forwards}
.pola.r .ph{background-image:url(assets/crowd-scene.webp);filter:blur(24px) saturate(.5) brightness(.75);transform:scale(1.15);animation:unblur 1.1s 1.5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes lin{from{opacity:0;transform:translate(-80px,40px)}to{opacity:1;transform:none}}
@keyframes rin{from{opacity:0;transform:translate(80px,40px)}to{opacity:1;transform:none}}
@keyframes unblur{to{filter:blur(0) saturate(1) brightness(1);transform:scale(1)}}
@keyframes slideTogetherL{to{transform:translateX(88px) rotate(2deg)}}
@keyframes slideTogetherR{to{transform:translateX(-88px) rotate(-2deg)}}
.lock{position:absolute;left:50%;top:44%;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:rgba(25,27,32,.86);display:grid;place-items:center;box-shadow:0 0 0 6px rgba(219,232,115,.95);animation:lockout .5s 1.5s ease-in forwards}
.lock svg{width:54px;height:54px;transform-origin:70% 60%;animation:shackle .5s 1.2s ease-out forwards}
@keyframes shackle{to{transform:rotate(-28deg) translateY(-4px)}}
@keyframes lockout{to{opacity:0;transform:scale(1.6)}}
.spark{position:absolute;top:360px;left:50%;width:0;height:6px;margin-left:0;background:linear-gradient(90deg,rgba(219,232,115,0),var(--accent),rgba(219,232,115,0));border-radius:3px;opacity:0;animation:spark 1.2s 2.0s ease-out forwards;z-index:15}
@keyframes spark{0%{opacity:0;width:0;margin-left:0}40%{opacity:1}100%{opacity:0;width:720px;margin-left:-360px}}
.tag{position:absolute;left:50%;top:640px;transform:translateX(-50%);z-index:30;background:var(--accent);color:var(--ink);font-weight:700;font-size:34px;letter-spacing:.1em;padding:.3em .9em;border-radius:6px;opacity:0;animation:rise .5s 3.4s cubic-bezier(.2,.9,.25,1) forwards;box-shadow:0 14px 22px rgba(0,0,0,.4)}
.line{position:absolute;left:0;right:0;text-align:center;color:var(--cream);font-weight:600;letter-spacing:.05em;opacity:0;z-index:35;text-shadow:0 6px 36px rgba(0,0,0,.7)}
.l1{bottom:236px;font-size:70px;animation:rise .7s .9s cubic-bezier(.2,.9,.25,1) forwards}
.l2{bottom:104px;font-size:96px;animation:rise .7s 1.9s cubic-bezier(.2,.9,.25,1) forwards}
.l2 .hl{color:var(--accent)}.l2 .hl::before{height:.09em;bottom:-.02em;transform:scaleX(0);animation:sweep .5s 2.7s cubic-bezier(.3,.7,.2,1) forwards}
.note{position:absolute;right:78px;bottom:58px;font-family:var(--mono);font-size:15px;letter-spacing:.14em;color:rgba(244,242,232,.45);z-index:45;opacity:0;animation:fade .6s .6s forwards}
</style></head>
<body>
<div class="card dark grain">
  <div class="eyebrow tl">WHAT IF</div>
  <div class="eyebrow tr">BY CONSENT · BOTH WAYS</div>
  <div class="pola l"><div class="tape" style="rotate:-3deg"></div><div class="ph"></div><div class="cap"><b>我的 · 舞台</b><span>21:47</span></div></div>
  <div class="pola r"><div class="tape" style="rotate:4deg"></div><div class="ph"></div><div class="cap"><b>她的 · 人海</b><span>21:48</span></div>
    <div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="#f4f2e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div></div>
  <div class="spark"></div>
  <div class="tag">同一刻 · 相差 1 分钟</div>
  <div class="line l1">如果，每个人的那一面，</div>
  <div class="line l2">可以被<span class="hl">自愿</span>地换回来呢？</div>
  <div class="note">示例照片由 AI 生成 · 虚构场景</div>
  <div class="vignette"></div><div class="frame"></div>
</div>
</body></html>
