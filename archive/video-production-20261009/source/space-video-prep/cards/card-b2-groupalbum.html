<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Card B2 · pain beat 2 — group album</title>
<link rel="stylesheet" href="cards.css">
<style>
.dark{background:radial-gradient(900px 520px at 50% -8%,rgba(232,163,92,.28),transparent 65%),radial-gradient(1100px 700px at 50% 120%,rgba(41,76,62,.55),transparent 60%),linear-gradient(#17191d,#1b2420 70%,#182d26)}
.dark .frame{border-color:#0f1a16}.dark .frame::after{border-color:rgba(244,242,232,.16)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45));pointer-events:none;z-index:40}
.eyebrow{color:rgba(244,242,232,.55)}
.eyebrow.tl{position:absolute;left:78px;top:70px;opacity:0;animation:fade .6s .2s forwards}
.eyebrow.tr{position:absolute;right:78px;top:70px;opacity:0;animation:fade .6s .3s forwards}
/* the grid of "same-looking" shots */
.grid{position:absolute;left:150px;top:170px;width:1620px;display:grid;grid-template-columns:repeat(6,1fr);gap:22px;transform:rotate(-1.2deg);transform-origin:50% 0}
.t{position:relative;aspect-ratio:3/2;background-size:cover;border:8px solid var(--paper2);border-bottom-width:30px;box-shadow:0 18px 26px rgba(0,0,0,.5);opacity:0;animation:tin .55s cubic-bezier(.2,.9,.25,1) forwards,shake 2.4s ease-in-out infinite}
.t i{position:absolute;left:0;right:0;bottom:-26px;height:22px;text-align:center;font:600 15px/22px var(--mono);letter-spacing:.14em;color:#4b5148;font-style:normal}
.t::after{content:attr(data-ts);position:absolute;left:0;right:0;bottom:-27px;text-align:center;font:600 15px/22px var(--mono);letter-spacing:.14em;color:#4b5148}
@keyframes tin{from{opacity:0;transform:translateY(-120px) rotate(var(--r0,-9deg)) scale(1.1)}to{opacity:1;transform:rotate(var(--r1,0deg))}}
@keyframes shake{0%,100%{rotate:0deg}50%{rotate:var(--w,.8deg)}}
.badge{position:absolute;right:120px;top:130px;z-index:30;min-width:190px;padding:.1em .5em;border-radius:999px;background:var(--coral);color:#fff;font:800 76px/1.15 Arial,sans-serif;text-align:center;box-shadow:0 12px 20px rgba(0,0,0,.45);opacity:0;animation:badge .5s 1.6s cubic-bezier(.2,.9,.25,1.4) forwards}
@keyframes badge{from{opacity:0;transform:scale(.2) rotate(-20deg)}to{opacity:1;transform:rotate(6deg)}}
.veil{position:absolute;inset:0;background:linear-gradient(rgba(15,22,19,0) 38%,rgba(15,22,19,.88) 64%);z-index:25;opacity:0;animation:fade .6s 1.2s forwards}
.line{position:absolute;left:0;right:0;text-align:center;color:var(--cream);font-weight:600;letter-spacing:.05em;opacity:0;z-index:35;text-shadow:0 6px 36px rgba(0,0,0,.7)}
.l1{bottom:196px;font-size:84px;animation:rise .7s 1.5s cubic-bezier(.2,.9,.25,1) forwards}
.l2{bottom:78px;font-size:96px;animation:rise .7s 2.3s cubic-bezier(.2,.9,.25,1) forwards}
.l2 .hl{color:var(--accent)}.l2 .hl::before{height:.09em;bottom:-.02em;transform:scaleX(0);animation:sweep .5s 3.1s cubic-bezier(.3,.7,.2,1) forwards}
.note{position:absolute;right:78px;bottom:58px;font-family:var(--mono);font-size:15px;letter-spacing:.14em;color:rgba(244,242,232,.45);z-index:45;opacity:0;animation:fade .6s .6s forwards}
</style></head>
<body>
<div class="card dark grain">
  <div class="eyebrow tl">GROUP ALBUM / 群相册</div>
  <div class="eyebrow tr">SAME NIGHT · NO ORDER</div>
  <div class="grid" id="grid"></div>
  <div class="badge">99+</div>
  <div class="veil"></div>
  <div class="line l1">群相册能收齐照片，</div>
  <div class="line l2">却分不清哪一张是<span class="hl">同一刻</span>。</div>
  <div class="note">示例照片由 AI 生成 · 虚构场景</div>
  <div class="vignette"></div><div class="frame"></div>
</div>
<script>
// 18 "shots" cropped differently from the same fictional stage photo, with scrambled capture times
const times=['21:52','21:47','22:03','21:49','21:58','21:47','22:11','21:55','21:48','22:06','21:51','21:47','22:01','21:53','21:50','22:09','21:46','21:57'];
const crops=[[50,30,1.2],[20,45,1.5],[75,35,1.1],[35,20,1.8],[60,55,1.3],[45,40,1.0],[80,25,1.6],[15,35,1.2],[55,30,2.0],[30,50,1.4],[70,45,1.1],[40,25,1.7],[25,40,1.3],[65,30,1.9],[50,50,1.0],[85,40,1.5],[10,30,1.2],[45,35,1.4]];
const g=document.getElementById('grid');
const photos=['assets/stage-scene.webp','assets/crowd-scene.webp'];
for(let i=0;i<18;i++){
  const d=document.createElement('div');d.className='t';
  const [x,y,z]=crops[i];
  d.style.backgroundImage=`url(${photos[i%7===3?1:0]})`;
  d.style.backgroundPosition=`${x}% ${y}%`;d.style.backgroundSize=`${z*100}%`;
  d.dataset.ts=times[i];
  d.style.setProperty('--r0',(Math.sin(i*7.3)*12).toFixed(1)+'deg');d.style.setProperty('--r1',(Math.sin(i*3.1)*1.6).toFixed(1)+'deg');d.style.setProperty('--w',(Math.sin(i*2.2)*1.1).toFixed(2)+'deg');
  d.style.animationDelay=`${(0.15+i*0.055).toFixed(2)}s, ${(1.5+i*0.07).toFixed(2)}s`;
  g.appendChild(d);
}
</script>
</body></html>
