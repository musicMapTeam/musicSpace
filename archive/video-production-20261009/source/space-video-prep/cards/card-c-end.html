<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Card C · end card</title>
<link rel="stylesheet" href="cards.css">
<style>
.stage{position:absolute;inset:0}
.eyebrow.tl{position:absolute;left:96px;top:70px;opacity:0;animation:fade .6s .2s forwards}
.eyebrow.tr{position:absolute;right:96px;top:70px;opacity:0;animation:fade .6s .3s forwards}
.mus{position:absolute;left:156px;top:176px;font-family:var(--mono);font-size:34px;letter-spacing:.42em;color:var(--green2);opacity:0;animation:fade .6s .25s forwards}
.wm{position:absolute;left:140px;top:200px;font-size:318px;height:300px;white-space:nowrap}
.wm span{opacity:0;animation:letter .7s cubic-bezier(.2,.9,.25,1.1) forwards}
.wm span:nth-child(1){animation-delay:.1s}.wm span:nth-child(2){animation-delay:.2s}.wm span:nth-child(3){animation-delay:.3s}.wm span:nth-child(4){animation-delay:.4s}.wm span:nth-child(5){animation-delay:.5s}
.tag{position:absolute;left:156px;top:552px;font-size:70px;font-weight:600;letter-spacing:.06em}
.tag .txt{display:inline-block;opacity:0;transform:translateY(24px);animation:rise .6s .95s ease-out forwards}
.tag .hl::before{transform:scaleX(0);animation:sweep .5s 1.05s cubic-bezier(.3,.7,.2,1) forwards}
.close{position:absolute;left:160px;top:640px;font-size:40px;font-weight:500;letter-spacing:.1em;color:var(--green);opacity:0;animation:rise .7s 2.2s cubic-bezier(.2,.9,.25,1) forwards}
.close b{font-weight:700;color:var(--ink)}
.linkrow{position:absolute;left:156px;top:722px;opacity:0;animation:rise .6s 1.5s cubic-bezier(.2,.9,.25,1) forwards}
.link{display:inline-flex;align-items:center;gap:22px;background:var(--green);color:var(--cream);border-radius:20px;padding:24px 36px;box-shadow:0 18px 30px rgba(24,45,38,.28);border:3px solid var(--deep)}
.link .arrow{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--deep);font-size:34px;font-weight:800}
.link .url{font-family:var(--mono);font-size:45px;letter-spacing:.01em;font-weight:600;color:var(--cream)}
.linkhint{margin-top:20px;font-size:28px;letter-spacing:.14em;color:var(--green2);opacity:0;animation:fade .6s 2.0s forwards}
.qr{position:absolute;right:170px;top:176px;width:440px;background:var(--paper2);padding:30px 30px 84px;box-shadow:0 34px 50px rgba(24,45,38,.32);rotate:3deg;opacity:0;animation:qrin .8s 1.7s cubic-bezier(.2,.9,.25,1) forwards}
.qr img{width:100%;display:block}
.qr .cap{position:absolute;left:30px;right:30px;bottom:26px;text-align:center;font-size:27px;font-weight:600;letter-spacing:.12em;color:var(--ink)}
.qr .tape{position:absolute;top:-20px;left:50%;width:140px;height:40px;margin-left:-70px;background:rgba(219,232,115,.85);transform:rotate(-4deg);box-shadow:0 2px 3px rgba(0,0,0,.18)}
@keyframes qrin{from{opacity:0;transform:translateY(120px) rotate(10deg)}to{opacity:1;transform:none}}
.floor{height:128px}
.wave .avatar{height:330px;bottom:46px;opacity:0;animation:pop .75s cubic-bezier(.2,.9,.25,1) forwards,bob 2.4s ease-in-out infinite}
.wave .shadow{bottom:38px;opacity:0;animation:fade .5s forwards}
.foot{position:absolute;left:156px;bottom:48px;z-index:6;font-family:var(--mono);font-size:18px;letter-spacing:.1em;color:rgba(244,242,232,.86);text-shadow:0 1px 2px rgba(24,45,38,.6);opacity:0;animation:fade .6s 3.0s forwards;line-height:1.7}
</style></head>
<body>
<div class="card paper grain">
  <div class="stage">
    <div class="eyebrow tl">MUSIC SPACE / LIVEHOUSE</div>
    <div class="eyebrow tr">腾讯音乐首届高校 AI HACKATHON · 参赛作品</div>
    <div class="mus">M U S I C</div>
    <div class="wordmark wm"><span>s</span><span>p</span><span>a</span><span>c</span><span>e</span></div>
    <div class="tag"><span class="hl"><span class="txt">同一刻，另一面。</span></span></div>
    <div class="close">AI 只<b>建议</b>视角，<b>选择由你</b>。</div>
    <div class="linkrow">
      <div class="link"><div class="arrow">↗</div><div class="url">musicmapteam.github.io/musicSpace/</div></div>
      <div class="linkhint">浏览器直接打开 · 无需安装</div>
    </div>
    <div class="qr"><div class="tape"></div><img src="assets/qr.svg" alt="QR"><div class="cap">扫一扫，打开示例现场</div></div>
    <div class="foot">示例角色、场次与照片均为虚构（AI 生成）· 示例角色自动回应<br>在线 Demo 在浏览器内运行 · 照片不上传</div>
    <div class="floor"></div>
    <div class="wave" id="wave"></div>
  </div>
  <div class="frame"></div>
</div>
<script>
const set=[['static','front',1478,2.15],['echo','front',1630,2.3],['cap','quarter',1782,2.45]];
const root=document.getElementById('wave');
set.forEach(([id,view,cx,d],i)=>{
  const sh=document.createElement('div');sh.className='shadow';sh.style.left=(cx-75)+'px';sh.style.animationDelay=d+'s';
  const im=document.createElement('img');im.className='avatar';im.src=`assets/avatar-${id}-${view}.svg`;im.style.left=(cx-80)+'px';im.style.animationDelay=`${d}s, ${(3.4+i*0.2).toFixed(2)}s`;
  root.append(sh,im);
});
</script>
</body></html>
