<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Plan A card C · end card (dusk)</title>
<link rel="stylesheet" href="cards.css"><link rel="stylesheet" href="theme-dusk.css">
<style>
.stage{position:absolute;inset:0}
.eyebrow.tl{position:absolute;left:96px;top:78px;opacity:0;animation:fade .6s .2s forwards}
.eyebrow.tr{position:absolute;right:96px;top:78px;opacity:0;animation:fade .6s .3s forwards}
.brand{position:absolute;left:150px;top:176px;display:flex;align-items:center;gap:34px;opacity:0;animation:rise .8s .15s cubic-bezier(.2,.9,.25,1) forwards}
.brand .petal{transform:rotate(-15deg) scale(1.0);margin-right:6px}
.brand b{font:800 168px/1 -apple-system,'SF Pro Display','Helvetica Neue','PingFang SC',Arial,sans-serif;letter-spacing:-.035em;color:var(--cream)}
.tag{position:absolute;left:156px;top:420px;font-size:80px;font-weight:700;letter-spacing:.07em;color:var(--cream)}
.tag .txt{display:inline-block;opacity:0;transform:translateY(24px);animation:rise .6s .95s ease-out forwards}
.tag .pk{color:var(--accent)}
.tag .hl::before{height:.13em;bottom:.02em;transform:scaleX(0);animation:sweep .5s 1.1s cubic-bezier(.3,.7,.2,1) forwards;opacity:.9}
.close{position:absolute;left:160px;top:540px;font-size:40px;font-weight:500;letter-spacing:.1em;color:rgba(251,243,223,.86);opacity:0;animation:rise .7s 2.0s cubic-bezier(.2,.9,.25,1) forwards}
.close b{font-weight:700;color:var(--accent)}
.linkrow{position:absolute;left:156px;top:660px;opacity:0;animation:rise .6s 1.5s cubic-bezier(.2,.9,.25,1) forwards}
.link{display:inline-flex;align-items:center;gap:22px;background:var(--cream);color:#1b1438;border-radius:20px;padding:22px 34px;box-shadow:0 18px 34px rgba(4,2,20,.5),0 0 0 3px rgba(242,162,193,.9)}
.link .arrow{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;background:var(--accent);color:#1b1438;font-size:34px;font-weight:800}
.link .url{font-family:var(--mono);font-size:44px;letter-spacing:.01em;font-weight:700;color:#1b1438}
.linkhint{margin-top:20px;font-size:27px;letter-spacing:.14em;color:rgba(251,243,223,.72);opacity:0;animation:fade .6s 2.0s forwards}
.qr{position:absolute;right:170px;top:200px;width:440px;background:var(--cream);padding:30px 30px 84px;box-shadow:0 34px 60px rgba(4,2,20,.6);rotate:3deg;opacity:0;animation:qrin .8s 1.7s cubic-bezier(.2,.9,.25,1) forwards}
.qr img{width:100%;display:block}
.qr .cap{position:absolute;left:30px;right:30px;bottom:26px;text-align:center;font-size:27px;font-weight:600;letter-spacing:.12em;color:#1b1438}
.qr .tape{position:absolute;top:-20px;left:50%;width:140px;height:40px;margin-left:-70px;background:rgba(242,162,193,.86);transform:rotate(-4deg);box-shadow:0 2px 3px rgba(0,0,0,.18)}
@keyframes qrin{from{opacity:0;transform:translateY(120px) rotate(10deg)}to{opacity:1;transform:none}}
.foot{position:absolute;left:156px;bottom:48px;z-index:6;font-family:var(--mono);font-size:18px;letter-spacing:.1em;color:rgba(251,243,223,.78);opacity:0;animation:fade .6s 3.0s forwards;line-height:1.75}
.petals i{position:absolute;width:16px;height:11px;border-radius:80% 20% 80% 20%;background:#e9a6bd;opacity:0;animation:fall 7s linear infinite}
@keyframes fall{0%{opacity:0;transform:translate(0,-40px) rotate(0)}10%{opacity:.8}90%{opacity:.7}100%{opacity:0;transform:translate(-160px,1120px) rotate(520deg)}}
</style></head>
<body>
<div class="card dark grain">
  <div class="stage">
    <div class="lights" id="lights"></div>
    <div class="petals" id="petals"></div>
    <div class="eyebrow tl">AFTER THE ENCORE / 散场以后</div>
    <div class="eyebrow tr">腾讯音乐首届高校 AI HACKATHON · 参赛作品</div>
    <div class="brand"><span class="petal"><i></i><i></i><i></i></span><b>Music Space</b></div>
    <div class="tag"><span class="hl"><span class="txt">同一刻，<span class="pk">另一面。</span></span></span></div>
    <div class="close">AI 只<b>建议</b>视角，<b>选择由你</b>。</div>
    <div class="linkrow">
      <div class="link"><div class="arrow">↗</div><div class="url">musicmapteam.github.io/musicSpace/</div></div>
      <div class="linkhint">浏览器直接打开 · 无需安装</div>
    </div>
    <div class="qr"><div class="tape"></div><img src="assets/qr.svg" alt="QR"><div class="cap">扫一扫，打开示例</div></div>
    <div class="foot">示例角色 Lin、阿遥与照片均为虚构（AI 生成）· 本地情景演示，数据只存在这个浏览器<br>在线 Demo 为静态版 · 在浏览器内运行 · 照片不上传 · 首次需下载约 10 MB 的本机 AI 模型</div>
  </div>
  <div class="vignette"></div><div class="frame"></div>
</div>
<script>
const L=document.getElementById('lights');for(let i=0;i<15;i++){const b=document.createElement('i');b.style.left=(2.5+i*6.9)+'%';b.style.top=(34+Math.sin(i/14*Math.PI)*34)+'px';b.style.opacity=0;b.style.animation=`fade .5s ${.3+i*.05}s forwards`;L.appendChild(b)}
const P=document.getElementById('petals');for(let i=0;i<9;i++){const b=document.createElement('i');b.style.left=(8+i*11)+'%';b.style.top='0px';b.style.animationDelay=(i*0.8)+'s';b.style.animationDuration=(6+(i%3))+'s';P.appendChild(b)}
</script>
</body></html>
