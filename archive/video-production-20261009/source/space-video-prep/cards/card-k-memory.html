<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Card K · the real exported memory-card PNG</title>
<link rel="stylesheet" href="cards.css">
<style>
.dark{background:radial-gradient(1000px 640px at 30% 40%,rgba(232,163,92,.30),transparent 62%),radial-gradient(1100px 700px at 80% 110%,rgba(41,76,62,.6),transparent 60%),linear-gradient(#17191d,#1b2420 70%,#182d26)}
.dark .frame{border-color:#0f1a16}.dark .frame::after{border-color:rgba(244,242,232,.16)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45));pointer-events:none;z-index:40}
.eyebrow{color:rgba(244,242,232,.55)}
.eyebrow.tl{position:absolute;left:78px;top:70px;opacity:0;animation:fade .6s .1s forwards}
.eyebrow.tr{position:absolute;right:78px;top:70px;opacity:0;animation:fade .6s .2s forwards}
.cardwrap{position:absolute;left:410px;top:122px;width:630px;height:840px;opacity:0;animation:fly 1.0s .15s cubic-bezier(.2,.9,.25,1) forwards}
.cardwrap img{width:100%;height:100%;display:block;box-shadow:0 50px 80px rgba(0,0,0,.6),0 4px 0 rgba(255,255,255,.35) inset}
.tape{position:absolute;top:-24px;left:50%;width:170px;height:46px;margin-left:-85px;background:rgba(219,232,115,.82);transform:rotate(-3deg);box-shadow:0 2px 3px rgba(0,0,0,.2)}
@keyframes fly{from{opacity:0;transform:translate(120px,260px) rotate(9deg) scale(.86)}to{opacity:1;transform:rotate(-3deg)}}
.ph{position:absolute;left:1120px;top:300px;width:640px}
.l1{font-size:84px;font-weight:600;letter-spacing:.05em;color:var(--cream);line-height:1.22;opacity:0;animation:rise .7s 1.0s cubic-bezier(.2,.9,.25,1) forwards}
.l1 .hl{color:var(--accent)}
.l1 .hl::before{height:.09em;bottom:-.02em;transform:scaleX(0);animation:sweep .5s 1.9s cubic-bezier(.3,.7,.2,1) forwards}
.l2{margin-top:34px;font-family:var(--mono);font-size:21px;letter-spacing:.14em;color:rgba(244,242,232,.75);line-height:1.8;opacity:0;animation:fade .6s 1.7s forwards}
.chip{display:inline-block;margin-top:30px;background:var(--accent);color:var(--ink);font-weight:700;font-size:30px;letter-spacing:.08em;padding:.3em .8em;border-radius:6px;opacity:0;animation:rise .5s 2.3s cubic-bezier(.2,.9,.25,1) forwards;box-shadow:0 14px 22px rgba(0,0,0,.4)}
</style></head>
<body>
<div class="card dark grain">
  <div class="eyebrow tl">AFTER THE SHOW / 回看这一晚</div>
  <div class="eyebrow tr">MEMORY CARD · PNG</div>
  <div class="cardwrap"><div class="tape"></div><img src="assets/memory-card.png" alt="memory card"></div>
  <div class="ph">
    <div class="l1">散场了，<br>把这一晚<span class="hl">留在手里</span>。</div>
    <div class="l2">真正导出的 PNG<br>在你的浏览器里生成 · 由你主动下载 · 不上传</div>
    <div class="chip">个人纪念卡</div>
  </div>
  <div class="vignette"></div><div class="frame"></div>
</div>
</body></html>
