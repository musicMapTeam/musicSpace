<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Plan A hook lockup · transparent overlay over the dimmed courtyard</title>
<link rel="stylesheet" href="cards.css"><link rel="stylesheet" href="theme-dusk.css">
<style>
html,body{background:transparent!important}
.col{animation:gone .5s 2.4s forwards;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:30px}
.eyebrow{color:var(--accent)!important;opacity:0;animation:fade .5s .15s forwards;font-size:21px;letter-spacing:.34em;margin-bottom:18px}
.name{display:flex;align-items:center;gap:34px;opacity:0;animation:pop2 .8s .25s cubic-bezier(.2,.9,.25,1.05) forwards}
.name .petal{transform:rotate(-15deg) scale(1.15)}
.name b{font:800 176px/1 -apple-system,'SF Pro Display','Helvetica Neue','PingFang SC',Arial,sans-serif;letter-spacing:-.035em;color:var(--cream);text-shadow:0 14px 60px rgba(8,6,28,.7)}
.tag{margin-top:46px;font-size:96px;font-weight:700;letter-spacing:.08em;color:var(--cream);text-shadow:0 8px 34px rgba(8,6,28,.7)}
.tag .txt{display:inline-block;opacity:0;transform:translateY(26px);animation:rise .6s 1.05s ease-out forwards}
.tag .pk{color:var(--accent)}
.tag .hl{position:relative;display:inline-block;z-index:0}
.tag .hl::before{content:"";position:absolute;left:-.1em;right:-.1em;bottom:.02em;height:.14em;background:var(--accent);z-index:-1;transform-origin:0 50%;transform:scaleX(0);animation:sweep .55s 1.3s cubic-bezier(.3,.7,.2,1) forwards;border-radius:2px;opacity:.9}
.sub{margin-top:30px;font-size:30px;letter-spacing:.2em;color:rgba(251,243,223,.82);opacity:0;animation:fade .6s 1.7s forwards}
@keyframes gone{to{opacity:0}}
@keyframes pop2{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
</style></head>
<body>
<div class="col">
  <div class="eyebrow">AFTER THE ENCORE / 散场以后</div>
  <div class="name"><span class="petal"><i></i><i></i><i></i></span><b>Music Space</b></div>
  <div class="tag"><span class="hl"><span class="txt">同一刻，<span class="pk">另一面。</span></span></span></div>
  <div class="sub">把彼此没有的那一面，换回来</div>
</div>
</body></html>
